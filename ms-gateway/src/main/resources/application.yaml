server:
  port: ${SERVER_PORT}

spring:
  application:
    name: ms-gateway
  cloud:
    gateway:
      default-filters:
        - AuthenticationFilter
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/api/auth/**
        - id: leagues-service
          uri: ${LEAGUES_SERVICE_URL}
          predicates:
            - Path=/api/leagues/**
        - id: teams-service
          uri: ${TEAMS_SERVICE_URL}
          predicates:
            - Path=/api/teams/**
        - id: fixtures-service
          uri: ${FIXTURES_SERVICE_URL}
          predicates:
            - Path=/api/fixtures/**
        - id: standings-service
          uri: ${STANDINGS_SERVICE_URL}
          predicates:
            - Path=/api/standings/**
        - id: notifications-service
          uri: ${NOTIFICATIONS_SERVICE_URL}
          predicates:
            - Path=/api/notifications/**
        - id: dashboard-service
          uri: ${DASHBOARD_SERVICE_URL}
          predicates:
            - Path=/api/dashboard/**
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  health:
    redis:
      enabled: false
